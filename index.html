<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Budżet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230A0B0D'/><g fill='%23ECEFF1'><path d='M16 5.5 25 10.5c.7.4 1 1.2.7 1.9-.3.6-.9 1-1.5 1H7.8c-.7 0-1.3-.4-1.5-1-.3-.7 0-1.5.7-1.9z'/><rect x='9' y='14' width='3' height='9' rx='1'/><rect x='14.5' y='14' width='3' height='9' rx='1'/><rect x='20' y='14' width='3' height='9' rx='1'/><rect x='7' y='24' width='18' height='2.5' rx='1'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#F4F5F7; --panel:#FFFFFF; --panel2:#F7F8FA; --panel3:#EDEFF1; --line:#E7E9ED;
  --text:#14161A; --dim:#6B7280; --dim2:#8A8F99;
  --c-ok:#199E5C; --c-acc:#E0A800; --c-konto:#3A6FD8; --c-kasa:#8B5CF6; --bad:#D64545;
  --t-ok:#158049; --t-acc:#9C7100; --t-konto:#2E58AE; --t-kasa:#6D28D9; --t-bad:#B93636;
  --f-ok:rgba(25,158,92,.12); --f-acc:rgba(224,168,0,.14); --f-konto:rgba(58,111,216,.12); --f-kasa:rgba(139,92,246,.12); --f-bad:rgba(214,69,69,.12);
  --btn-ink:#14161A;
  --shadow:0 1px 2px rgba(20,22,26,.06),0 4px 16px rgba(20,22,26,.04);
}
:root[data-theme="dark"]{
  --ink:#0A0B0D; --panel:#16181C; --panel2:#1E2127; --panel3:#2A2E36; --line:#2A2E36;
  --text:#EDEFF3; --dim:#8B919C; --dim2:#5F6672;
  --c-ok:#35D07F; --c-acc:#F5C542; --c-konto:#5B8DEF; --c-kasa:#A78BFA; --bad:#FF4D5E;
  --t-ok:#5FE39C; --t-acc:#FFD97A; --t-konto:#8FB4FF; --t-kasa:#C4B5FD; --t-bad:#FF8792;
  --f-ok:rgba(53,208,127,.16); --f-acc:rgba(245,197,66,.16); --f-konto:rgba(91,141,239,.16); --f-kasa:rgba(167,139,250,.16); --f-bad:rgba(255,77,94,.16);
  --btn-ink:#12131A; --shadow:none;
}
html,body{background:var(--ink)}
body{font-family:'Manrope',system-ui,-apple-system,sans-serif;color:var(--text);
  min-height:100vh;-webkit-font-smoothing:antialiased}
.mono{font-variant-numeric:tabular-nums}
.money{transition:filter .15s}
:root[data-hide="1"] .money{filter:blur(7px);user-select:none;-webkit-user-select:none}
.hidebtn{background:var(--panel3);border:0;border-radius:999px;width:28px;height:28px;flex:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);font-weight:700}
.dot{width:9px;height:9px;border-radius:999px;flex:none}
.shell{display:flex;min-height:100vh}
.side{width:232px;flex:none;background:var(--panel2);padding:28px 18px;display:flex;flex-direction:column;
  gap:26px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow:auto}
.side .brand{display:flex;align-items:center;gap:10px;padding-left:8px}
.side .brand i{width:30px;height:30px;border-radius:10px;background:var(--c-acc)}
.side .brand b{font-size:16px;font-weight:800}
.navitem{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;color:var(--dim);
  font-size:14px;font-weight:600;cursor:pointer;border:0;background:none;text-align:left;width:100%;font-family:inherit}
.navitem[data-on="1"]{background:var(--panel3);color:var(--text);font-weight:700}
.sidefoot{margin-top:auto;background:var(--panel);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sidefoot .navitem{padding:0;font-weight:700;color:var(--t-acc)}
.mainarea{flex:1;min-width:0}
.top{position:sticky;top:0;z-index:20;background:var(--ink);padding:16px 0 0;
  padding-top:calc(16px + env(safe-area-inset-top))}
.totalrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.total{font-size:28px;font-weight:800;letter-spacing:-.02em}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 20px;flex-wrap:wrap}
.monthnav{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:999px;padding:8px 8px 8px 16px;font-size:14px;font-weight:700}
.monthnav button{background:none;border:0;color:var(--dim);font-size:16px;cursor:pointer;padding:2px;font-family:inherit}
.monthnav .nx{width:26px;height:26px;border-radius:999px;background:var(--panel3);display:flex;align-items:center;justify-content:center;color:var(--text)}
.addbtn{display:none}
.hero{background:linear-gradient(160deg,var(--panel3) 0%,var(--panel) 55%,var(--panel) 100%);
  border-radius:24px;padding:22px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:16px}
.stackbar{display:flex;width:100%;border-radius:999px;overflow:hidden;background:var(--panel3)}
.stackseg{display:flex;align-items:center;justify-content:center;min-width:3px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.stackseg span{font-size:13px;font-weight:800;color:var(--btn-ink);white-space:nowrap}
.minitiles{display:flex;gap:8px;width:100%}
.minitile{flex:1;min-width:0;background:var(--ink);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.minitile .lbl{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minitile b{font-size:15px;font-weight:700}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:20px}
.card{background:var(--panel);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.card .v{font-size:22px;font-weight:800;margin-top:6px}
.card .s,.s{font-size:12px;color:var(--dim);margin-top:4px}
.sec{margin-top:24px}
.sec>h2{font-size:16px;font-weight:700;margin-bottom:10px}
label.f{display:block;margin-bottom:12px}
label.f>.eyebrow{display:block;margin-bottom:6px}
input,select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;font-family:'Manrope',sans-serif;font-size:16px}
input.num{font-size:22px;font-weight:700}
.seg2{display:flex;background:var(--panel2);border-radius:999px;padding:4px;gap:4px}
.seg2 button{flex:1;background:none;border:0;color:var(--dim);padding:10px 6px;cursor:pointer;
  border-radius:999px;font-size:13px;font-weight:700;font-family:inherit}
.seg2 button[data-on="1"]{background:var(--c-acc);color:var(--btn-ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel2);border:0;color:var(--dim);border-radius:999px;
  padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Manrope',sans-serif}
.chip[data-on="1"]{background:var(--f-acc);color:var(--t-acc)}
.btn{background:var(--c-acc);color:var(--btn-ink);border:0;border-radius:16px;padding:15px 18px;
  font-family:'Manrope',sans-serif;font-size:15px;font-weight:800;cursor:pointer;width:100%}
.btn.ghost{background:var(--panel2);color:var(--text)}
.btn.slim{padding:10px 16px;width:auto;border-radius:999px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.cattile{background:var(--panel2);border-radius:18px;padding:12px 6px;display:flex;flex-direction:column;
  align-items:center;gap:6px;cursor:pointer;border:0;font-family:'Manrope',sans-serif}
.cattile[data-on="1"]{background:var(--f-acc)}
.cattile span{font-size:11px;font-weight:700;color:var(--dim);text-align:center}
.cattile[data-on="1"] span{color:var(--t-acc)}
.badge{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;flex:none}
.item{display:flex;gap:12px;align-items:center;padding:12px 0}
.item+.item{border-top:1px solid var(--line)}
.item .m{flex:1;min-width:0}
.item .t1{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t2{font-size:12px;color:var(--dim);margin-top:2px}
.amt{font-size:15px;font-weight:700;white-space:nowrap}
.x{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px;padding:8px;line-height:1;border-radius:10px}
.empty{color:var(--dim);font-size:13px;padding:26px 0;text-align:center;border:1px dashed var(--line);border-radius:16px}
.warn{background:var(--f-bad);color:var(--t-bad);padding:12px 14px;border-radius:16px;font-size:13px;margin-top:10px;line-height:1.5;font-weight:600}
.warn.ok{background:var(--f-ok);color:var(--t-ok)}
.prog{height:6px;background:var(--panel3);border-radius:999px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--c-acc)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--c-acc);
  color:var(--btn-ink);padding:12px 20px;border-radius:999px;font-size:13px;font-weight:700;z-index:60;max-width:88vw;text-align:center;
  box-shadow:0 10px 28px rgba(0,0,0,.24)}
.gate{max-width:300px;margin:14vh auto;text-align:center;padding:0 20px}
.sync{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--dim)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.sync[data-st="ok"] i{background:var(--c-ok)} .sync[data-st="busy"] i{background:var(--c-acc)}
.sync[data-st="err"] i{background:var(--bad)}
pre.code{background:var(--panel2);border-radius:12px;padding:12px;
  font-family:ui-monospace,Menlo,monospace;font-size:11px;overflow-x:auto;white-space:pre;line-height:1.5;margin-top:8px;color:var(--text)}
ol.steps{margin:8px 0 0 18px;font-size:13px;line-height:1.7;color:var(--dim)}
ol.steps b{color:var(--text);font-weight:700}
.bottomnav{position:fixed;left:0;right:0;bottom:0;height:calc(88px + env(safe-area-inset-bottom));box-sizing:border-box;
  background:var(--ink);border-top:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-around;
  padding:14px 12px 0;z-index:30}
.navbtn{display:flex;flex-direction:column;align-items:center;gap:5px;width:56px;background:none;border:0;
  cursor:pointer;color:var(--dim);font-size:10px;font-weight:600;font-family:inherit}
.navbtn[data-on="1"]{color:var(--c-acc)}
.fab{width:56px;height:56px;border-radius:999px;background:var(--c-acc);display:flex;align-items:center;
  justify-content:center;margin-top:-16px;box-shadow:0 10px 26px rgba(224,168,0,.32);border:0;cursor:pointer}
:root[data-theme="dark"] .fab{box-shadow:0 10px 26px rgba(245,197,66,.32)}
@media (min-width:900px){
  .bottomnav{display:none}
  .addbtn{display:inline-flex;align-items:center}
}
@media (max-width:899px){
  .side{display:none}
  body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--c-konto);outline-offset:-2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" style="display:none"></div>

<script>
/* ================= dane ================= */
const KEY='budzet:v4', OLDKEY='budzet:v3', SYNCKEY='budzet:sync', THEMEKEY='budzet:theme', HIDEKEY='budzet:hide';
const ACCOUNTS=[
 {id:'konto',label:'Konto',color:'var(--c-konto)'},
 {id:'kasa',label:'Gotówka',color:'var(--c-kasa)'}];
const OUT_CATS=['Jedzenie','Subskrypcje','Barber','Transport','Sprzęt','Rozrywka','Inne'];
const IN_CAT='Od rodziców', MOVE_CAT='Bankomat';
const EMPTY={v:4,pin:null,tx:[],updatedAt:0};

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const accLabel=id=>(ACCOUNTS.find(a=>a.id===id)||{}).label||id;
const accColor=id=>(ACCOUNTS.find(a=>a.id===id)||{}).color||'var(--dim)';
const zl=n=>`<span class="money">${new Intl.NumberFormat('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0)} zł</span>`;
const zl0=n=>`<span class="money">${new Intl.NumberFormat('pl-PL',{maximumFractionDigits:0}).format(n||0)} zł</span>`;
const num=v=>Number(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const monthOf=iso=>String(iso).slice(0,7);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MONTHS=['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
const MONTHS_GEN=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const monthName=ym=>{const p=ym.split('-');return MONTHS[+p[1]-1]+' '+p[0]};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const dayLabel=iso=>{const p=iso.split('-');const d=+p[2]+' '+MONTHS_GEN[+p[1]-1];return iso===todayISO()?'Dziś · '+d:d};
const shiftMonth=(ym,d)=>{const p=ym.split('-').map(Number);const dt=new Date(p[0],p[1]-1+d,1);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')};
const kindLabel=k=>k==='in'?'Wpłata':k==='out'?'Wydatek':'Bankomat';

/* Dane ze starej wersji (koperty rodzice/moje/oszcz, trzy konta) — zostaje tylko to, co dotyczyło
   pieniędzy od rodziców. Konto główne i oszczędnościowe zlewają się w jedno „Konto”. */
function normalize(d){
  d=Object.assign({},EMPTY,d||{});
  const old=Array.isArray(d.tx)&&d.tx.some(t=>'envelope' in t);
  if(old){
    const A={glowne:'konto',oszcz:'konto',kasa:'kasa'};
    d.tx=d.tx.filter(t=>t.kind==='move'
        ?t.envelope==='rodzice'&&t.toEnvelope==='rodzice'&&A[t.account]!==A[t.toAccount]
        :t.envelope==='rodzice')
      .map(t=>{const n={id:t.id,kind:t.kind,amount:t.amount,date:t.date,account:A[t.account]||'konto',note:t.note||''};
        n.category=t.kind==='in'?IN_CAT:t.kind==='move'?MOVE_CAT:t.category;
        if(t.kind==='move')n.toAccount=A[t.toAccount]||'kasa';
        return n});
  }
  d.tx=Array.isArray(d.tx)?d.tx:[];
  return {v:4,pin:d.pin||null,tx:d.tx,updatedAt:d.updatedAt||0};
}

/* ================= ikony ================= */
const ICONS={
  food:'<path d="M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M17 3c-1.5 2-2 4-2 6h4c0-2-.5-4-2-6zM17 9v12"/>',
  sub:'<rect x="3" y="4" width="18" height="16" rx="5"/><path d="M10 9.5l5 2.5-5 2.5z"/>',
  barber:'<circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8 16L18 5M16 16L6 5"/>',
  transport:'<rect x="3" y="6" width="18" height="10" rx="3"/><path d="M6 16v2M18 16v2M3 11h18"/>',
  sprzet:'<rect x="3" y="5" width="18" height="11" rx="3"/><path d="M9 20h6M12 16v4"/>',
  rozrywka:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
  move:'<path d="M4 8h13M14 5l3 3-3 3M20 16H7M10 13l-3 3 3 3"/>',
  heart:'<path d="M12 20s-7-4.4-9.3-8.4C1 8.1 2.6 5 6.1 5c2 0 3.3 1.2 4.1 2.5C11 6.2 12.3 5 14.3 5c3.5 0 5.1 3.1 3.4 6.6C15.4 15.6 12 20 12 20z"/>',
  home:'<path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>',
  list:'<path d="M4 7h16M4 12h16M4 17h10"/>',
  gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" stroke-linecap="round"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff:'<path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.2 4.2M9.9 4.2A10.4 10.4 0 0 1 12 4c6.4 0 10 8 10 8a17.5 17.5 0 0 1-3.1 4.2M6.1 6.2C3.4 8 2 12 2 12s1.4 2.9 4.1 4.9"/>'
};
const CAT_ICON={Jedzenie:'food',Subskrypcje:'sub',Barber:'barber',Transport:'transport','Sprzęt':'sprzet',
  Rozrywka:'rozrywka','Od rodziców':'heart',Bankomat:'move'};
const NAVICON={przeglad:'home',historia:'list',ustawienia:'gear'};
function svgIcon(key,color,size){
  size=size||20;
  if(key==='dots')return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>`;
  const d=ICONS[key]||ICONS.gear;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
}
function catBadge(t){
  const accId=t.kind==='move'?t.toAccount:t.account;
  return `<span class="badge" style="background:var(--f-${accId})">${svgIcon(CAT_ICON[t.category]||'dots',accColor(accId))}</span>`;
}

let S, ui={tab:'przeglad',ym:todayISO().slice(0,7),edit:null,flt:'all',
  form:blankForm(),set:{pin:'',real:{},syncUrl:'',showSetup:false},syncState:'off'};

function blankForm(){return{kind:'out',amount:'',date:todayISO(),category:'Jedzenie',account:'konto',toAccount:'kasa',note:''}}

function loadLocal(){
  try{const r=localStorage.getItem(KEY);if(r)return normalize(JSON.parse(r));
    const o=localStorage.getItem(OLDKEY);return normalize(o?JSON.parse(o):null)}
  catch(e){return normalize(null)}}
function persist(push){S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Przeglądarka nie pozwala zapisać danych')}
  if(push!==false)queuePush()}
const syncUrl=()=>{try{return localStorage.getItem(SYNCKEY)||''}catch(e){return''}};

/* ================= synchronizacja ================= */
let pushTimer=null;
function queuePush(){if(!syncUrl())return;clearTimeout(pushTimer);pushTimer=setTimeout(push,1500)}
function setSync(st){ui.syncState=st;
  const label=({off:'lokalnie',busy:'zapisuję',ok:'w chmurze',err:'błąd sync'})[st];
  document.querySelectorAll('.sync').forEach(el=>{el.dataset.st=st;el.lastChild.textContent=label});
}
async function push(){
  const u=syncUrl();if(!u)return;setSync('busy');
  try{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'save',data:S})});
    const j=await r.json();setSync(j&&j.ok?'ok':'err')}
  catch(e){setSync('err')}
}
async function pull(){
  const u=syncUrl();if(!u){setSync('off');return}
  setSync('busy');
  try{
    const r=await fetch(u+'?action=load&t='+Date.now());const j=await r.json();
    if(j&&j.ok&&j.data&&typeof j.data==='object'){
      const remote=normalize(j.data);
      if((remote.updatedAt||0)>(S.updatedAt||0)){S=remote;localStorage.setItem(KEY,JSON.stringify(S));render();toast('Pobrano nowsze dane')}
      else if((S.updatedAt||0)>(remote.updatedAt||0)){push();return}
    }
    setSync('ok');
  }catch(e){setSync('err')}
}

/* ================= obliczenia ================= */
/* Suma kont = wszystkie wpłaty − wszystkie wydatki. Bankomat tylko przekłada między kontami. */
function calc(){
  const acc={konto:0,kasa:0};
  S.tx.forEach(t=>{
    if(t.kind==='in')acc[t.account]+=t.amount;
    else if(t.kind==='out')acc[t.account]-=t.amount;
    else{acc[t.account]-=t.amount;acc[t.toAccount]+=t.amount}
  });
  const M=S.tx.filter(t=>monthOf(t.date)===ui.ym), sum=a=>a.reduce((s,t)=>s+t.amount,0);
  const inM=sum(M.filter(t=>t.kind==='in')), outs=M.filter(t=>t.kind==='out'), outM=sum(outs);
  const byCat={}; outs.forEach(t=>{byCat[t.category]=(byCat[t.category]||0)+t.amount});
  const today=todayISO(), cur=monthOf(today);
  const p=ui.ym.split('-').map(Number), dim=new Date(p[0],p[1],0).getDate();
  const days=ui.ym===cur?+today.slice(8,10):ui.ym<cur?dim:0;
  return{acc,total:acc.konto+acc.kasa,inM,outM,perDay:days?outM/days:null,
    byCat:Object.entries(byCat).sort((a,b)=>b[1]-a[1])};
}

const GAS=`// Synchronizacja panelu budżetu — wklej całość w Rozszerzenia → Apps Script.
// Ten sam kod pokazuje aplikacja w Ustawieniach (stała GAS w index.html) — trzymaj je identyczne.
var PLIK = 'budzet.json';

function doGet(e){
  var f = znajdz();
  if (!f) return out({ok:true, data:null});
  try { return out({ok:true, data: JSON.parse(f.getBlob().getDataAsString())}); }
  catch (err) { return out({ok:false, error:'Plik budzet.json jest uszkodzony'}); }
}

function doPost(e){
  var lock = LockService.getScriptLock();
  try {
    lock.waitLock(10000);
    var body = JSON.parse(e.postData.contents);
    if (body.action !== 'save' || !body.data || !Array.isArray(body.data.tx))
      return out({ok:false, error:'Nieprawidłowe dane'});
    var json = JSON.stringify(body.data);
    var f = znajdz();
    if (f) f.setContent(json);
    else DriveApp.createFile(PLIK, json, MimeType.PLAIN_TEXT);
    mirror(body.data);
    return out({ok:true});
  } catch (err) {
    return out({ok:false, error:String(err)});
  } finally {
    lock.releaseLock();
  }
}

function znajdz(){
  var it = DriveApp.getFilesByName(PLIK);
  while (it.hasNext()) { var f = it.next(); if (!f.isTrashed()) return f; }
  return null;
}

function mirror(d){
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  if (!ss) return;
  var sh = ss.getSheetByName('Transakcje') || ss.insertSheet('Transakcje');
  var gdzie = {konto:'Konto', kasa:'Gotówka'};
  var typ = {'in':'Wpłata', out:'Wydatek', move:'Bankomat'};
  var rows = [['Data','Typ','Kwota','Kategoria','Skąd / gdzie','Dokąd','Opis']];
  (d.tx || []).slice().sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; })
    .forEach(function(t){
      rows.push([t.date, typ[t.kind] || '', t.amount, t.category || '', gdzie[t.account] || '',
        t.kind === 'move' ? (gdzie[t.toAccount] || '') : '', t.note || '']);
    });
  sh.clear();
  sh.getRange(1, 1, rows.length, rows[0].length).setValues(rows);
  sh.getRange(1, 1, 1, rows[0].length).setFontWeight('bold');
  sh.setFrozenRows(1);
  if (rows.length > 1) sh.getRange(2, 3, rows.length - 1, 1).setNumberFormat('#,##0.00 "zł"');
}

function out(o){
  return ContentService.createTextOutput(JSON.stringify(o))
    .setMimeType(ContentService.MimeType.JSON);
}`;

  };

  root.onkeydown=e=>{if(e.key==='Enter'&&e.target.id==='pinin')act('unlock')};
  root.onclick=e=>{const el=e.target.closest('[data-act]');if(el)act(el.dataset.act)};

function act(a){
  const [k,v]=[a.slice(0,a.indexOf(':')===-1?a.length:a.indexOf(':')),a.slice(a.indexOf(':')+1)];
  switch(k){
    case 'tab': ui.tab=v; if(v!=='dodaj'){ui.edit=null;ui.form=blankForm()} return render();
    case 'month': ui.ym=shiftMonth(ui.ym,Number(v)); return render();
    case 'flt': ui.flt=v; return render();
    case 'kind': {
      const f=ui.form; f.kind=v; f.account='konto';
      if(v==='out')f.category='Jedzenie';
      if(v==='in')f.category=IN_CAT;
      if(v==='move'){f.category=MOVE_CAT;f.toAccount='kasa'}
      return render();
    }
    case 'cat': ui.form.category=v; return render();
    case 'acc': ui.form.account=v; return render();
    case 'dir': ui.form.account=v; ui.form.toAccount=v==='konto'?'kasa':'konto'; return render();
    case 'submit': return submitForm();
    case 'cancel': ui.edit=null; ui.form=blankForm(); ui.tab='przeglad'; return render();
    case 'edit': {const t=S.tx.find(x=>x.id===v); if(!t)return;
      ui.edit=t; ui.form=Object.assign(blankForm(),t,{amount:String(t.amount)}); ui.tab='dodaj'; return render()}
    case 'del': if(!confirm('Usunąć ten wpis?'))return;
      S.tx=S.tx.filter(t=>t.id!==v); persist(); toast('Usunięto'); return render();
    case 'check': return render();
    case 'pinset': {const p=String(ui.set.pin||'').replace(/\D/g,'');
      if(p.length<4){toast('PIN musi mieć min. 4 cyfry');return}
      S.pin=p; ui.set.pin=''; persist(); toast('PIN ustawiony'); return render()}
    case 'pinoff': S.pin=null; persist(); toast('PIN wyłączony'); return render();
    case 'unlock': {const el=document.getElementById('pinin');
      if(el&&el.value===S.pin){ui.unlocked=true;return render()}
      document.getElementById('pinerr').innerHTML='<div class="warn" style="text-align:left">Zły PIN. Spróbuj jeszcze raz.</div>';
      if(el){el.value='';el.focus()} return}
    case 'theme': setTheme(v); return render();
    case 'hide': setHidden(!hidden()); return render();
    case 'setup': ui.set.showSetup=!ui.set.showSetup; return render();
    case 'syncsave': {const u=String(ui.set.syncUrl||'').trim();
      if(u&&!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){toast('Adres musi kończyć się na /exec');return}
      localStorage.setItem(SYNCKEY,u); toast(u?'Połączono — pobieram dane':'Synchronizacja wyłączona');
      if(u)pull(); else setSync('off'); return render()}
    case 'syncnow': return pull();
    case 'xlsx': return exportXlsx(calc());
    case 'jsonout': return exportJson();
    case 'jsonin': return importJson();
    case 'wipe': if(!confirm('Skasować wszystkie wpisy? Tego nie da się cofnąć.'))return;
      S=Object.assign({},EMPTY,{tx:[]}); persist(); toast('Wyczyszczono'); return render();
  }
}

function submitForm(){
  const f=ui.form, v=num(f.amount);
  if(!(v>0)||!f.date){toast('Podaj kwotę i datę');return}
  const t={id:ui.edit?ui.edit.id:uid(),kind:f.kind,amount:Math.round(v*100)/100,date:f.date,
    category:f.kind==='in'?IN_CAT:f.kind==='move'?MOVE_CAT:f.category,account:f.account,note:f.note.trim()};
  if(f.kind==='move')t.toAccount=f.account==='konto'?'kasa':'konto';
  S.tx=S.tx.filter(x=>x.id!==t.id).concat([t]);
  persist(); toast(ui.edit?'Zapisano zmiany':'Dodano');
  ui.edit=null; ui.form=blankForm(); ui.tab='przeglad'; render();
}

function exportXlsx(c){
  if(typeof XLSX==='undefined'){toast('Brak połączenia — Excel wymaga internetu');return}
  const rows=S.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>({
    Data:t.date,Typ:kindLabel(t.kind),Kwota:t.amount,Kategoria:t.category||'',
    'Skąd / gdzie':accLabel(t.account),'Dokąd':t.kind==='move'?accLabel(t.toAccount):'',Opis:t.note||''}));
  const m=monthName(ui.ym);
  const sum=[['Na koncie',c.acc.konto],['W gotówce',c.acc.kasa],['Razem',c.total],
    ['Wpłynęło '+m,c.inM],['Wydane '+m,c.outM]].concat(c.byCat.map(([k,v])=>['  '+k+' ('+m+')',v]))
    .map(r=>({Pozycja:r[0],Kwota:r[1]}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sum),'Podsumowanie');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Transakcje');
  XLSX.writeFile(wb,'budzet-'+todayISO()+'.xlsx'); toast('Pobrano plik Excela');
}
function exportJson(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='budzet-'+todayISO()+'.json';
  a.click();URL.revokeObjectURL(a.href);toast('Zapisano kopię');
}
function importJson(){
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.tx))throw 0;
      if(!confirm('Wczytać kopię? Obecne dane zostaną zastąpione.'))return;
      S=normalize(d);persist();toast('Wczytano kopię');render()}
      catch(e){toast('To nie wygląda na kopię tego panelu')}};
    r.readAsText(f)};
  i.click();
}

/* ================= motyw ================= */
function theme(){try{return localStorage.getItem(THEMEKEY)||'dark'}catch(e){return 'dark'}}
function setTheme(t){
  try{localStorage.setItem(THEMEKEY,t)}catch(e){}
  document.documentElement.dataset.theme=t;
  const m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',t==='dark'?'#0A0B0D':'#F4F5F7');
}

/* ================= prywatność ================= */
function hidden(){try{return localStorage.getItem(HIDEKEY)==='1'}catch(e){return false}}
function setHidden(v){
  try{localStorage.setItem(HIDEKEY,v?'1':'0')}catch(e){}
  document.documentElement.dataset.hide=v?'1':'0';
}

/* ================= start ================= */
setTheme(theme());
setHidden(hidden());
S=loadLocal();
ui.unlocked=!S.pin;
ui.syncState=syncUrl()?'busy':'off';
render();
if(syncUrl())pull();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&syncUrl())pull()});
</script>
